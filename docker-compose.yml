services:
  postgres:
    image: postgres:17-alpine
    container_name: queueboard-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-queueboard}
      POSTGRES_USER: ${DB_USERNAME:-queueboard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-queueboard}
      TZ: Europe/Kyiv
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - queueboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  queueboard-pgdata:
