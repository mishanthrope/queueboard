databaseChangeLog:
  - changeSet:
      id: 02-create-orders
      author: queueboard
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: poster_check_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_orders_poster_check_id
              - column:
                  name: display_number
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: comment
                  type: VARCHAR(500)
              - column:
                  name: paid_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: estimated_ready_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: ready_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: issued_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: cancelled_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: orders
            indexName: idx_orders_status_paid_at
            columns:
              - column:
                  name: status
              - column:
                  name: paid_at
        - createIndex:
            tableName: orders
            indexName: idx_orders_created_at
            columns:
              - column:
                  name: created_at
