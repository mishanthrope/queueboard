databaseChangeLog:
  - changeSet:
      id: 04-create-analytics
      author: queueboard
      changes:
        - createTable:
            tableName: analytics_processed_events
            columns:
              - column:
                  name: event_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: analytics_processed_events
            indexName: idx_analytics_events_occurred_at
            columns:
              - column:
                  name: occurred_at
        - createTable:
            tableName: analytics_orders
            columns:
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: display_number
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: paid_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: estimated_ready_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: started_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: ready_at
                  type: TIMESTAMP WITH TIME ZONE
        - createIndex:
            tableName: analytics_orders
            indexName: idx_analytics_orders_ready_at
            columns:
              - column:
                  name: ready_at
        - createTable:
            tableName: analytics_modifier_usage
            columns:
              - column:
                  name: day
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: modifier
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: times
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: analytics_modifier_usage
            columnNames: day, modifier
            constraintName: pk_analytics_modifier_usage
